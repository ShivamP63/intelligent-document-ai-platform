name: Backend and frontend checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
        working-directory: backend
      - run: pytest -q
        working-directory: backend
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docai_local
          POSTGRES_USER: docai_dev
          POSTGRES_PASSWORD: change_me_local_only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docai_dev -d docai_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://docai_dev:change_me_local_only@localhost:5434/docai_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
        working-directory: backend
      - name: Apply Alembic migration and inspect tables
        working-directory: backend
        run: |
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ['DATABASE_URL'])
          tables = set(inspect(engine).get_table_names())
          assert {'documents', 'document_pages', 'alembic_version'} <= tables, tables
          print('PostgreSQL migration passed')
          PY
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and start the complete local stack
        run: docker compose up -d --build
      - name: Wait for API and browser UI
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8000/api/health && curl -fsS http://localhost:5174/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run end-to-end browser test
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect logs if a step failed
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down

  hosted-browser-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and prepare Chromium
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test hosted demo with NO backend
        working-directory: frontend
        env:
          VITE_DEMO_MODE: 'true'
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/demo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5174/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready:-0}" != 1 ]; then
            cat /tmp/demo-server.log
            exit 1
          fi
          npx playwright test --config playwright.demo.config.ts
