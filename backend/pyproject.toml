[build-system]
requires = ["setuptools>=69","wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "intelligent-document-api"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","python-multipart>=0.0.20","pypdf>=5,<8","sqlalchemy>=2,<3","psycopg[binary]>=3,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10","httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
